# SonarCloud / SonarQube Project Configuration for Aegis-Quant Studio
# Documentation: https://docs.sonarcloud.io/advanced-setup/project-settings/

sonar.projectKey=LeDanix_aegis-quant-bot
sonar.organization=ledanix
sonar.projectName=Aegis-Quant Algorithmic Trading Bot

# Source directories for analysis
sonar.sources=aegis_quant,web_app
sonar.tests=tests

# Language specific settings
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.environments=browser

# Exclusions for data feeds, generated summaries, vendor libs, and static caches
sonar.exclusions=data/**,web_app/static/echarts.min.js,web_app/static/tailwind.css,**/*.json,**/*.jsonl,**/*.min.js
sonar.coverage.exclusions=tests/**,web_app/static/**,main_backtest.py,daily_scanner.py,build_dashboard.py
